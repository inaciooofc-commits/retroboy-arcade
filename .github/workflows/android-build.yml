name: Android debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RETROBOY_CATALOG_URL: ${{ secrets.RETROBOY_CATALOG_URL }}
      RETROBOY_TURN_URL: ${{ secrets.RETROBOY_TURN_URL }}
      RETROBOY_TURN_USERNAME: ${{ secrets.RETROBOY_TURN_USERNAME }}
      RETROBOY_TURN_CREDENTIAL: ${{ secrets.RETROBOY_TURN_CREDENTIAL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: retroboy-arcade-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
